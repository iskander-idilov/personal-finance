plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '2.2.2'
}

group = 'com.iskander.finance'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'org.postgresql:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

// Пароль от БД читается из переменной окружения DB_PASSWORD (см. .env.example).
// На этапе конфигурации Gradle мы не падаем, если она не задана, — иначе ломались бы
// задачи, не требующие подключения к БД (например, обычная сборка). Реальная проверка
// происходит перед выполнением задач Liquibase, см. gradle.taskGraph.whenReady ниже.
def dbPasswordEnv = System.getenv('DB_PASSWORD')

liquibase {
    activities {
        main {
            changelogFile 'src/main/resources/db/changelog/db.changelog-master.xml'
            url System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/BitLab'
            username System.getenv('DB_USERNAME') ?: 'postgres'
            password dbPasswordEnv
            driver 'org.postgresql.Driver'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ['update', 'diffChangelog', 'status', 'rollback'] || it.group == 'liquibase' } && !dbPasswordEnv) {
        throw new GradleException("Environment variable DB_PASSWORD is not set. Copy .env.example to .env, fill it in, and export the values before running Liquibase tasks.")
    }
}

tasks.named('test') {
    useJUnitPlatform()
    doFirst {
        if (!System.getenv('DB_PASSWORD')) {
            throw new GradleException("Environment variable DB_PASSWORD is not set. Copy .env.example to .env, fill it in, export the values, then re-run the tests (or run the postgres-test service via docker compose).")
        }
    }
}