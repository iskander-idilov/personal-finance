<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="d-flex">
  <div th:replace="~{layout :: sidebar}"></div>

  <div class="flex-grow-1 p-4 bg-light">
    <h1 class="mb-4">Финансовые новости</h1>

    <div th:if="${#lists.isEmpty(news)}" class="text-muted">
      <span class="spinner-border spinner-border-sm me-2" role="status"></span>
      Новости загружаются...
    </div>

    <div th:if="${not #lists.isEmpty(news)}" class="row row-cols-1 row-cols-md-2 g-4">
      <div th:each="article : ${news}" class="col">
        <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden">

          <!-- Изображение или заглушка -->
          <div style="height: 200px; overflow: hidden; background: #f0f0f0;">
            <img th:if="${article.image != null}"
                 th:src="${article.image}"
                 class="w-100 h-100"
                 style="object-fit: cover;"
                 onerror="this.parentElement.innerHTML='<div class=\'d-flex align-items-center justify-content-center h-100 text-muted\'><i class=\'bi bi-newspaper fs-1\'></i></div>'">
            <div th:if="${article.image == null}"
                 class="d-flex align-items-center justify-content-center h-100 text-muted">
              <i class="bi bi-newspaper fs-1"></i>
            </div>
          </div>

          <div class="card-body d-flex flex-column p-3">
            <h6 class="card-title fw-bold mb-2" th:text="${article.headline}"></h6>
            <p class="card-text text-muted small mb-3"
               th:text="${article.summary}"></p>
            <a th:href="${article.url}" target="_blank"
               class="btn btn-primary btn-sm mt-auto">
              Читать далее →
            </a>
          </div>

          <div class="card-footer bg-white border-0 text-muted small px-3 pb-3">
            <i class="bi bi-clock me-1"></i>
            <span th:text="${article.datetime}"></span>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
