<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="au-layout">
  <div th:replace="~{layout :: sidebar}"></div>
  <main class="au-main">
    <div class="au-page-title au-fade">Финансовые новости</div>
    <div th:if="${#lists.isEmpty(news)}" style="display:flex; align-items:center; gap:10px; color:var(--muted2); padding:20px 0;" class="au-fade">
      <span class="au-spinner"></span> Новости загружаются...
    </div>
    <div th:if="${not #lists.isEmpty(news)}" style="display:grid; grid-template-columns:repeat(2,1fr); gap:16px;">
      <div th:each="article, iter : ${news}"
           class="au-card au-fade"
           th:style="'animation-delay:' + ${iter.index * 0.06} + 's'"
           style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
        <div style="height:170px; overflow:hidden; background:var(--cream2); flex-shrink:0;">
          <img th:if="${article.image != null}" th:src="${article.image}"
               style="width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s;"
               onerror="this.parentElement.innerHTML='&lt;div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;color:#b0a898;&quot;&gt;&lt;i class=&quot;bi bi-newspaper&quot; style=&quot;font-size:2rem;&quot;&gt;&lt;/i&gt;&lt;/div&gt;'"
               onmouseover="this.style.transform='scale(1.04)'" onmouseout="this.style.transform='scale(1)'">
          <div th:if="${article.image == null}" style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted2);">
            <i class="bi bi-newspaper" style="font-size:2rem;"></i>
          </div>
        </div>
        <div style="padding:18px 20px; display:flex; flex-direction:column; flex:1;">
          <div style="font-size:14px; font-weight:500; color:var(--dark); line-height:1.45; margin-bottom:8px;" th:text="${article.headline}"></div>
          <div style="font-size:12.5px; color:var(--muted); line-height:1.55; flex:1; overflow:hidden;
                      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;" th:text="${article.summary}"></div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
            <span style="font-size:11px; color:var(--muted2); font-family:var(--mono);">
              <i class="bi bi-clock" style="margin-right:3px;"></i>
              <span th:text="${article.datetime}"></span>
            </span>
            <a th:href="${article.url}" target="_blank" class="au-btn au-btn-outline au-btn-sm">
              Читать <i class="bi bi-arrow-up-right"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
