<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{layout :: sidebar}"></div>

    <div class="flex-grow-1 p-4 bg-light">
        <h1 class="mb-4">Добро пожаловать!</h1>

        <!-- Карточки -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Текущий баланс</h6>
                        <h3 th:text="${account.balance}"></h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Общий доход</h6>
                        <h3 class="text-success" th:text="${totalIncome}"></h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Общий расход</h6>
                        <h3 class="text-danger" th:text="${totalExpense}"></h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Диаграмма и транзакции -->
        <div class="row align-items-stretch">
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Расходы по категориям</h5>
                        <div style="height: 400px;">
                            <canvas id="expensesChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title mb-3">Последние транзакции</h5>
                        <div style="overflow-y: auto; max-height: 400px;">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>Сумма</th>
                                    <th>Тип</th>
                                    <th>Категория</th>
                                    <th>Дата</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="transaction : ${transactions}">
                                    <td th:text="${transaction.amount}"></td>
                                    <td th:text="${transaction.type == T(finance.entity.TransactionType).INCOME ? 'Доход' : 'Расход'}"></td>
                                    <td th:text="${transaction.categoryName}"></td>
                                    <td th:text="${#temporals.format(transaction.date, 'dd.MM.yyyy HH:mm')}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Акции -->
        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Рынок</h5>
                <table class="table table-borderless">
                    <tbody>
                    <tr th:each="stock : ${stocks}">
                        <td><strong th:text="${stock.ticker}"></strong></td>
                        <td th:text="${stock.price}"></td>
                        <td>
                            <span th:class="${stock.positive} ? 'badge bg-success' : 'badge bg-danger'"
                                  th:text="${stock.changePercent}">
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    const data = /*[[${expensesByCategory}]]*/ {};
    const labels = Object.keys(data);
    const values = Object.values(data);

    const hasData = values.length > 0;

    new Chart(document.getElementById('expensesChart'), {
        type: 'doughnut',
        data: {
            labels: hasData ? labels : ['Нет данных'],
            datasets: [{
                data: hasData ? values : [1],
                backgroundColor: hasData ? [
                    '#4CAF50', '#2196F3', '#FF9800', '#F44336', '#9C27B0',
                    '#00BCD4', '#FF5722', '#607D8B', '#E91E63', '#3F51B5'
                ] : ['#e0e0e0']
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            if (!hasData) return 'Нет данных';
                            return context.label + ': ' + context.parsed;
                        }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
