<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="d-flex">
  <div th:replace="~{layout :: sidebar}"></div>

  <div class="flex-grow-1 p-4 bg-light">
    <h1>Транзакции</h1>
    <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
      Добавить транзакцию
    </button>

    <form th:action="@{/transactions/search}" method="get" class="d-flex">
      <input type="text" name="search" placeholder="Поиск..." class="form-control me-2" style="max-width: 300px;">
      <button type="submit" class="btn btn-outline-secondary">Найти</button>
    </form>
    </div>

    <table class="table table-striped">
      <thead>
      <tr>
        <th>Сумма</th>
        <th>Тип</th>
        <th>Категория</th>
        <th>Дата</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.amount}"></td>
        <td th:text="${transaction.type == T(finance.entity.TransactionType).INCOME ? 'Доход' : 'Расход'}"></td>
        <td th:text="${transaction.categoryName}"></td>
        <td th:text="${#temporals.format(transaction.date, 'dd.MM.yyyy HH:mm')}"></td>
        <td>
          <button class="btn btn-sm btn-outline-primary"
                  data-bs-toggle="modal"
                  th:data-bs-target="'#editModal' + ${transaction.id}">
            <i class="bi bi-pencil"></i>
          </button>
          <form th:action="@{/transactions/delete}" method="post" class="d-inline">
            <input type="hidden" name="id" th:value="${transaction.id}">
            <button type="submit" class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <!-- Модальные окна редактирования -->
    <div th:each="transaction : ${transactions}">
      <div class="modal fade" th:id="'editModal' + ${transaction.id}" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Редактировать транзакцию</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form th:action="@{/transactions/edit}" method="post">
                <input type="hidden" name="id" th:value="${transaction.id}">
                <select name="type"
                        th:id="'editType' + ${transaction.id}"
                        class="form-control mb-3"
                        th:onchange="'filterEditCategories(' + ${transaction.id} + ')'">
                  <option value="INCOME" th:selected="${transaction.type.name() == 'INCOME'}">Доход</option>
                  <option value="EXPENSE" th:selected="${transaction.type.name() == 'EXPENSE'}">Расход</option>
                </select>
                <select name="categoryId"
                        th:id="'editCategory' + ${transaction.id}"
                        class="form-control mb-3">
                  <option th:each="category : ${categories}"
                          th:value="${category.id}"
                          th:text="${category.name}"
                          th:attr="data-type=${category.type}"
                          th:selected="${category.id == transaction.categoryId}">
                  </option>
                </select>
                <input type="number" name="amount" th:value="${transaction.amount}" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100">Сохранить</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно добавления -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1"
         data-bs-event="shown.bs.modal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить транзакцию</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/transactions}" method="post">
              <select name="type" id="typeSelect" class="form-control mb-3" onchange="filterCategories()">
                <option value="INCOME">Доход</option>
                <option value="EXPENSE">Расход</option>
              </select>
              <select name="categoryId" id="categorySelect" class="form-control mb-3">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:attr="data-type=${category.type}">
                </option>
              </select>
              <input type="text" name="amount" placeholder="Введите сумму" class="form-control mb-3" required>
              <button type="submit" class="btn btn-success w-100">Добавить</button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let allCategories = [];

  window.onload = function() {
    const select = document.getElementById('categorySelect');
    allCategories = Array.from(select.options).map(opt => ({
      value: opt.value,
      text: opt.text,
      type: opt.dataset.type
    }));
    filterCategories();
  };

  function filterCategories() {
    const type = document.getElementById('typeSelect').value;
    const select = document.getElementById('categorySelect');
    select.innerHTML = '';
    allCategories.filter(c => c.type === type).forEach(c => {
      const option = document.createElement('option');
      option.value = c.value;
      option.text = c.text;
      select.appendChild(option);
    });
  }

  function filterEditCategories(transactionId, selectedCategoryId) {
    const type = document.getElementById('editType' + transactionId).value;
    const select = document.getElementById('editCategory' + transactionId);
    const current = selectedCategoryId || (select.options[select.selectedIndex] && select.options[select.selectedIndex].value);
    select.innerHTML = '';
    allCategories.filter(c => c.type === type).forEach(c => {
      const option = document.createElement('option');
      option.value = c.value;
      option.text = c.text;
      if (c.value === current) option.selected = true;
      select.appendChild(option);
    });
  }

  document.getElementById('addTransactionModal').addEventListener('shown.bs.modal', function() {
    filterCategories();
  });

  document.querySelectorAll('[id^="editModal"]').forEach(function(modal) {
    modal.addEventListener('shown.bs.modal', function() {
      const transactionId = modal.id.replace('editModal', '');
      const categorySelect = document.getElementById('editCategory' + transactionId);
      const selectedCategoryId = categorySelect ? categorySelect.value : null;
      filterEditCategories(transactionId, selectedCategoryId);
    });
  });
</script>
</body>
</html>
