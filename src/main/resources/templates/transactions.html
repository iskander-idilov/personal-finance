<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="d-flex">
  <div th:replace="~{layout :: sidebar}"></div>

  <div class="flex-grow-1 p-4 bg-light">
    <h1>Транзакции</h1>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
      Добавить транзакцию
    </button>

    <!-- Bootstrap класс table делает красивую таблицу -->
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Сумма</th>
        <th>Тип</th>
        <th>Категория</th>
        <th>Дата</th>
      </tr>
      </thead>
      <tbody>
      <!-- th:each — цикл по каждой транзакции из модели -->
      <tr th:each="transaction : ${transactions}">
        <!-- каждое поле — отдельная ячейка -->
        <td th:text="${transaction.amount}"></td>
        <td th:text="${transaction.type}"></td>
        <!-- category — это объект, берём его поле name -->
        <td th:text="${transaction.category.name}"></td>
        <td th:text="${transaction.date}"></td>
      </tr>
      </tbody>
    </table>
    <!-- Модальное окно добавления -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить транзакцию</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/transactions}" method="post">
              <select name="type" class="form-control mb-3">
                <option value="INCOME">Доход</option>
                <option value="EXPENSE">Расход</option>
              </select>
              <select name="categoryId" class="form-control mb-3">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>
              </select>
              <input type="text" name="amount" placeholder="Введите сумму" class="form-control mb-3" required>
              <button type="submit" class="btn btn-success w-100">Добавить</button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
