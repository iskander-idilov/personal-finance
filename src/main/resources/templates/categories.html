<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="au-layout">
  <div th:replace="~{layout :: sidebar}"></div>
  <main class="au-main">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px;" class="au-fade">
      <div class="au-page-title" style="margin-bottom:0;">Категории</div>
      <button class="au-btn au-btn-primary" style="margin-top:6px;" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        <i class="bi bi-plus"></i> Добавить
      </button>
    </div>
    <div th:if="${error}" class="au-alert au-alert-danger au-fade" th:text="${error}"></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px;">
      <div th:each="category, iter : ${categories}"
           class="au-card au-fade"
           th:style="'animation-delay:' + ${iter.index * 0.04} + 's'"
           style="padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:nowrap;">
        <div style="display:flex; align-items:center; gap:10px; min-width:0; overflow:hidden; flex:1;">
          <div style="width:30px; height:30px; border-radius:7px; background:var(--cream2);
                      display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <i th:if="${category.icon}" th:class="'bi ' + ${category.icon}" style="color:var(--gold); font-size:14px;"></i>
            <i th:if="${category.icon == null}" class="bi bi-tag" style="color:var(--gold); font-size:14px;"></i>
          </div>
          <span style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                th:text="${category.name}" th:title="${category.name}"></span>
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;" th:style="${category.default} ? 'visibility:hidden' : ''">
          <button class="au-btn au-btn-ghost au-btn-sm" data-bs-toggle="modal"
                  th:data-bs-target="'#editModal' + ${category.id}">
            <i class="bi bi-pencil" style="font-size:11px;"></i>
          </button>
          <form th:action="@{/categories/delete}" method="post" style="display:inline;">
            <input type="hidden" name="id" th:value="${category.id}">
            <button type="submit" class="au-btn au-btn-danger au-btn-sm"><i class="bi bi-trash" style="font-size:11px;"></i></button>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit modals -->
    <div th:each="category : ${categories}">
      <div class="modal fade au-modal" th:id="'editModal' + ${category.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <span class="modal-title">Редактировать категорию</span>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form th:action="@{/categories/edit}" method="post">
                <input type="hidden" name="id" th:value="${category.id}">
                <div class="au-form-group">
                  <label class="au-label">Название</label>
                  <input type="text" name="name" th:value="${category.name}" class="au-input" required>
                </div>
                <button type="submit" class="au-btn au-btn-primary" style="width:100%; justify-content:center;">Сохранить</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add modal -->
    <div class="modal fade au-modal" id="addCategoryModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <span class="modal-title">Новая категория</span>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/categories}" method="post">
              <div class="au-form-group">
                <label class="au-label">Название</label>
                <input type="text" name="name" placeholder="Название категории" class="au-input" required>
              </div>
              <button type="submit" class="au-btn au-btn-primary" style="width:100%; justify-content:center;">
                <i class="bi bi-plus"></i> Добавить
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
