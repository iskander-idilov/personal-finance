<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="au-layout">
  <div th:replace="~{layout :: sidebar}"></div>
  <main class="au-main">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px;" class="au-fade">
      <div class="au-page-title" style="margin-bottom:0;">Категории</div>
      <button class="au-btn au-btn-primary" style="margin-top:6px;" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        <i class="bi bi-plus"></i> Добавить
      </button>
    </div>
    <div th:if="${error}" class="au-alert au-alert-danger au-fade" th:text="${error}"></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:10px;">
      <div th:each="category, iter : ${categories}"
           class="au-card au-fade"
           th:style="'animation-delay:' + ${iter.index * 0.04} + 's; padding:14px 16px 44px; position:relative; min-height:80px;'">
        <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
          <div style="width:30px; height:30px; border-radius:7px; background:var(--cream2);
                      display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <i th:if="${category.icon}" th:class="'bi ' + ${category.icon}" style="color:var(--gold); font-size:14px;"></i>
            <i th:if="${category.icon == null}" class="bi bi-tag" style="color:var(--gold); font-size:14px;"></i>
          </div>
          <span style="font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                th:text="${category.name}" th:title="${category.name}"></span>
        </div>
        <div th:style="'display:flex; gap:4px; position:absolute; bottom:10px; right:10px;' + (${category.default} ? ' visibility:hidden;' : '')">
          <button class="au-btn au-btn-ghost au-btn-sm" data-bs-toggle="modal"
                  th:data-bs-target="'#editModal' + ${category.id}">
            <i class="bi bi-pencil" style="font-size:11px;"></i>
          </button>
          <form th:action="@{/categories/delete}" method="post" style="display:inline;">
            <input type="hidden" name="id" th:value="${category.id}">
            <button type="submit" class="au-btn au-btn-danger au-btn-sm"><i class="bi bi-trash" style="font-size:11px;"></i></button>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit modals -->
    <div th:each="category : ${categories}">
      <div class="modal fade au-modal" th:id="'editModal' + ${category.id}" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <span class="modal-title">Редактировать категорию</span>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form th:action="@{/categories/edit}" method="post">
                <input type="hidden" name="id" th:value="${category.id}">
                <div class="au-form-group">
                  <label class="au-label">Название</label>
                  <input type="text" name="name" th:value="${category.name}" class="au-input" required>
                </div>
                <div class="au-form-group">
                  <label class="au-label">Тип</label>
                  <div style="display:flex; gap:8px;">
                    <label th:style="'flex:1; display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px 14px; border-radius:8px; border:1.5px solid ' + (${category.type == T(finance.entity.TransactionType).EXPENSE} ? 'var(--gold)' : 'var(--cream2)') + '; transition:border-color .15s;'"
                           th:id="'lbl-expense-' + ${category.id}">
                      <input type="radio" name="type" value="EXPENSE"
                             th:checked="${category.type == T(finance.entity.TransactionType).EXPENSE}"
                             style="accent-color:var(--gold);"
                             th:onchange="'highlightEditType(' + ${category.id} + ')'">
                      <i class="bi bi-arrow-up-circle" style="color:#e05c5c;"></i> Расход
                    </label>
                    <label th:style="'flex:1; display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px 14px; border-radius:8px; border:1.5px solid ' + (${category.type == T(finance.entity.TransactionType).INCOME} ? 'var(--gold)' : 'var(--cream2)') + '; transition:border-color .15s;'"
                           th:id="'lbl-income-' + ${category.id}">
                      <input type="radio" name="type" value="INCOME"
                             th:checked="${category.type == T(finance.entity.TransactionType).INCOME}"
                             style="accent-color:var(--gold);"
                             th:onchange="'highlightEditType(' + ${category.id} + ')'">
                      <i class="bi bi-arrow-down-circle" style="color:#4caf7d;"></i> Доход
                    </label>
                  </div>
                </div>
                <button type="submit" class="au-btn au-btn-primary" style="width:100%; justify-content:center;">Сохранить</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add modal -->
    <div class="modal fade au-modal" id="addCategoryModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <span class="modal-title">Новая категория</span>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/categories}" method="post">
              <div class="au-form-group">
                <label class="au-label">Название</label>
                <input type="text" name="name" placeholder="Название категории" class="au-input" required>
              </div>
              <div class="au-form-group">
                <label class="au-label">Тип</label>
                <div style="display:flex; gap:8px;">
                  <label style="flex:1; display:flex; align-items:center; gap:8px; cursor:pointer;
                                padding:10px 14px; border-radius:8px; border:1.5px solid var(--cream2);
                                transition:border-color .15s;" id="lbl-expense">
                    <input type="radio" name="type" value="EXPENSE" required
                           style="accent-color:var(--gold);" onchange="highlightType()">
                    <i class="bi bi-arrow-up-circle" style="color:#e05c5c;"></i> Расход
                  </label>
                  <label style="flex:1; display:flex; align-items:center; gap:8px; cursor:pointer;
                                padding:10px 14px; border-radius:8px; border:1.5px solid var(--cream2);
                                transition:border-color .15s;" id="lbl-income">
                    <input type="radio" name="type" value="INCOME"
                           style="accent-color:var(--gold);" onchange="highlightType()">
                    <i class="bi bi-arrow-down-circle" style="color:#4caf7d;"></i> Доход
                  </label>
                </div>
              </div>
              <button type="submit" class="au-btn au-btn-primary" style="width:100%; justify-content:center;">
                <i class="bi bi-plus"></i> Добавить
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function highlightType() {
  var expense = document.querySelector('#addCategoryModal input[value="EXPENSE"]');
  var income  = document.querySelector('#addCategoryModal input[value="INCOME"]');
  document.getElementById('lbl-expense').style.borderColor = expense.checked ? 'var(--gold)' : 'var(--cream2)';
  document.getElementById('lbl-income').style.borderColor  = income.checked  ? 'var(--gold)' : 'var(--cream2)';
}
function highlightEditType(id) {
  var modal   = document.getElementById('editModal' + id);
  var expense = modal.querySelector('input[value="EXPENSE"]');
  var income  = modal.querySelector('input[value="INCOME"]');
  document.getElementById('lbl-expense-' + id).style.borderColor = expense.checked ? 'var(--gold)' : 'var(--cream2)';
  document.getElementById('lbl-income-'  + id).style.borderColor = income.checked  ? 'var(--gold)' : 'var(--cream2)';
}
</script>
</body>
</html>
