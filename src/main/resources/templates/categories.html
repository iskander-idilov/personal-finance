<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="d-flex">
  <div th:replace="~{layout :: sidebar}"></div>

  <div class="flex-grow-1 p-4 bg-light">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Категории</h1>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        + Добавить категорию
      </button>
    </div>

    <div class="row">
      <div class="col-md-3 mb-3" th:each="category : ${categories}">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6 class="card-title" th:text="${category.name}"></h6>
            <div class="d-flex gap-2 mt-3">

              <button class="btn btn-sm btn-outline-primary"
                      data-bs-toggle="modal"
                      th:data-bs-target="'#editModal' + ${category.id}">
                <i class="bi bi-pencil"></i> Edit
              </button>

              <form th:action="@{/categories/delete}" method="post">
                <input type="hidden" name="id" th:value="${category.id}">
                <button type="submit" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>
              </form>

            </div>
          </div>
        </div>

        <!-- Модальное окно редактирования для каждой карточки -->
        <div class="modal fade" th:id="'editModal' + ${category.id}" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Редактировать категорию</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form th:action="@{/categories/edit}" method="post">
                  <input type="hidden" name="id" th:value="${category.id}">
                  <input type="text" name="name" th:value="${category.name}" class="form-control mb-3" required>
                  <button type="submit" class="btn btn-primary w-100">Сохранить</button>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Модальное окно добавления -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить категорию</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form th:action="@{/categories}" method="post">
              <input type="text" name="name" placeholder="Название категории" class="form-control mb-3" required>
              <button type="submit" class="btn btn-success w-100">Добавить</button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
