<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<div class="au-layout">
  <div th:replace="~{layout :: sidebar}"></div>
  <main class="au-main" style="display:flex; align-items:center; justify-content:center;">
    <div style="text-align:center;" class="au-fade">
      <div style="width:72px; height:72px; border-radius:16px; background:rgba(192,57,43,0.07);
                  border:1px solid rgba(192,57,43,0.15); display:flex; align-items:center;
                  justify-content:center; margin:0 auto 20px; font-size:28px; color:var(--danger);">
        <i class="bi bi-shield-lock"></i>
      </div>
      <div style="font-family:var(--serif); font-size:26px; font-weight:600; margin-bottom:8px;">Доступ запрещён</div>
      <div style="color:var(--muted); font-size:14px; margin-bottom:24px;">У вас нет прав для просмотра этой страницы.</div>
      <a th:href="@{/}" href="/" class="au-btn au-btn-primary">
        <i class="bi bi-house"></i> На главную
      </a>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
