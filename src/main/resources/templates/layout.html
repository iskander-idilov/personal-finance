<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <title>Личные финансы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <!-- Боковое меню -->
  <div th:fragment="sidebar" class="bg-white border-end d-flex flex-column" style="width: 250px; min-height: 100vh;">
    <div class="p-4 d-flex flex-column" style="flex: 1;">
      <img th:src="@{/images/logo.png}" alt="AURUM" style="width: 200px; margin-bottom: 10px;">
      <nav class="mt-4">
        <a href="/" th:classappend="${currentUri == '/'} ? ' fw-bold text-primary' : ''"
           class="d-block py-2 text-decoration-none text-dark">
          <i class="bi bi-house me-2"></i>Главная
        </a>
        <a href="/transactions" th:classappend="${currentUri != null and currentUri.startsWith('/transactions')} ? ' fw-bold text-primary' : ''"
           class="d-block py-2 text-decoration-none text-dark">
          <i class="bi bi-arrow-left-right me-2"></i>Транзакции
        </a>
        <a href="/categories" th:classappend="${currentUri != null and currentUri.startsWith('/categories')} ? ' fw-bold text-primary' : ''"
           class="d-block py-2 text-decoration-none text-dark">
          <i class="bi bi-tag me-2"></i>Категории
        </a>
        <a href="/news" th:classappend="${currentUri != null and currentUri.startsWith('/news')} ? ' fw-bold text-primary' : ''"
           class="d-block py-2 text-decoration-none text-dark">
          <i class="bi bi-newspaper me-2"></i>Новости
        </a>
        <a href="#" class="d-block py-2 text-decoration-none text-dark">
          <i class="bi bi-gear me-2"></i>Настройки
        </a>
      </nav>

      <form th:action="@{/logout}" method="post" class="mt-auto">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-link text-danger text-decoration-none p-0">
          <i class="bi bi-box-arrow-right me-2"></i>Выход
        </button>
      </form>
    </div>
  </div>

  <div class="flex-grow-1 p-4 bg-light">
    <!-- Сюда вставляется контент -->
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
